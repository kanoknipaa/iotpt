<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f0f2f5; padding: 40px 20px; }
        .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .status-box { font-size: 28px; font-weight: bold; margin: 20px 0; padding: 15px; border-radius: 10px; }
        .occupied { background-color: #ffebee; color: #c62828; }
        .available { background-color: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚗 สถานะลานจอดรถ</h2>
        <div id="status-box" class="status-box">กำลังโหลด...</div>
        <p>ระยะทางล่าสุด: <strong id="distance-text">-</strong> ซม.</p>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxE2f8pE1qio1b41KINpgkv2xXlx_QNVErzvzdko_PoosjVDmW3zzTEcagx2Jt0dWwD/exec";

        async function updateDashboard() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();

                const statusBox = document.getElementById('status-box');
                const distanceText = document.getElementById('distance-text');

                distanceText.innerText = data.distance;

                if (data.status === 'occupied' || data.status === 'มีรถ') {
                    statusBox.innerText = "❌ มีรถจอดอยู่";
                    statusBox.className = "status-box occupied";
                } else {
                    statusBox.innerText = "✅ ช่องจอดว่าง";
                    statusBox.className = "status-box available";
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        setInterval(updateDashboard, 3000);
        updateDashboard();
    </script>
</body>
</html>
